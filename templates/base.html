<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Newsletter Listener</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.6; }
        header { border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
        .flash { background: #eef; padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        .card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .sender-list { display: flex; flex-wrap: wrap; gap: 10px; }
        .sender-tag { background: #eee; padding: 5px 10px; border-radius: 15px; text-decoration: none; color: #333; }
        .btn { background: #007bff; color: white; padding: 8px 15px; text-decoration: none; border-radius: 5px; display: inline-block; }
        .btn-sync { background: #28a745; }
    </style>
</head>
<body>
    <header>
        <h1>Newsletter Listener</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/settings">Settings</a>
            <a href="/sync" class="btn btn-sync">Sync Now</a>
        </nav>
    </header>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
        {% for message in messages %}
          <div>{{ message }}</div>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
