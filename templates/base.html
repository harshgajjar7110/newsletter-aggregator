<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Newsletter Listener</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --secondary-color: #03dac6;
            --danger-color: #cf6679;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        a { color: var(--accent-color); text-decoration: none; }
        a:hover { text-decoration: underline; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 { margin: 0; font-size: 1.5rem; }

        nav a { margin-left: 15px; font-weight: bold; font-size: 0.9rem; }

        .btn {
            background: #333;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn:hover { background: #444; text-decoration: none; }
        .btn-primary { background: var(--accent-color); color: #000; }
        .btn-secondary { background: var(--secondary-color); color: #000; }
        .btn-danger { background: var(--danger-color); color: #000; }

        .flash {
            background: #332b00;
            color: #fff8e1;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: 1px solid #665c00;
        }

        /* Tabs */
        .tabs { display: flex; border-bottom: 2px solid #333; margin-bottom: 20px; }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            font-weight: bold;
            color: #888;
        }
        .tab.active {
            border-bottom-color: var(--accent-color);
            color: var(--text-color);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Cards */
        .card {
            background: var(--card-bg);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); }
        .card h3 { margin-top: 0; margin-bottom: 10px; font-size: 1.2rem; }
        .card p { color: #aaa; font-size: 0.9rem; margin: 0; }

        .badge {
            background: var(--accent-color);
            color: black;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-left: 10px;
        }

        /* Stack Effect */
        .stack-card {
            position: relative;
            z-index: 1;
        }
        .stack-card::before {
            content: "";
            position: absolute;
            top: 5px; left: 5px; right: -5px; bottom: -5px;
            background: #2a2a2a;
            border-radius: 8px;
            z-index: -1;
            opacity: 0.6;
        }
        .stack-card::after {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: -10px; bottom: -10px;
            background: #252525;
            border-radius: 8px;
            z-index: -2;
            opacity: 0.3;
        }

    </style>
</head>
<body>
    <header>
        <h1><a href="/" style="color: var(--text-color)">Newsletter Listener</a></h1>
        <nav>
            <a href="/settings">Settings</a>
            <a href="/sync" class="btn btn-secondary" style="margin-left: 15px;">Sync</a>
        </nav>
    </header>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
        {% for message in messages %}
          <div>{{ message }}</div>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        // Simple Tab Logic
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.add('active');
            });
        });
    </script>
</body>
</html>
