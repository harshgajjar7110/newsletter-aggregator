{% extends 'base.html' %}

{% block content %}
<style>
    .player-controls {
        position: sticky;
        top: 0;
        background: #1e1e1e;
        padding: 15px;
        border-bottom: 1px solid #333;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 15px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        margin: -20px -20px 20px -20px; /* Offset parent padding */
    }

    .content-area {
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-size: 1.2rem;
        line-height: 1.8;
        color: #ccc;
        white-space: pre-wrap;
    }

    .highlight {
        background-color: rgba(187, 134, 252, 0.3); /* Accent color with opacity */
        color: #fff;
        border-radius: 3px;
        padding: 2px 0;
        transition: background-color 0.2s;
    }

    .status-badge {
        font-size: 0.8rem;
        padding: 2px 6px;
        border-radius: 4px;
        background: #333;
        color: #aaa;
        margin-left: 10px;
    }
</style>

<div class="player-controls">
    <button id="btn-play" class="btn btn-primary">Play</button>
    <button id="btn-pause" class="btn" style="display:none;">Pause</button>
    <button id="btn-stop" class="btn btn-danger">Stop</button>

    <select id="select-speed" class="btn" style="background: #333;">
        <option value="1">1.0x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2.0x</option>
    </select>

    <button id="btn-done" class="btn btn-secondary" style="margin-left: auto;">Mark Done</button>
</div>

<div style="margin-bottom: 20px;">
    <h2>{{ newsletter.subject }} <span id="status-display" class="status-badge">{{ newsletter.status }}</span></h2>
    <p style="color: #888;">From: {{ newsletter.sender }} | {{ newsletter.date_received.strftime('%Y-%m-%d') }}</p>
</div>

<div id="newsletter-content" class="content-area"></div>

<!-- Raw text hidden for JS to process -->
<div id="raw-text" style="display:none;">{{ newsletter.content_text }}</div>

<script>
    const newsletterId = {{ newsletter.id }};
    const rawText = document.getElementById('raw-text').innerText;
    const contentArea = document.getElementById('newsletter-content');
    const statusDisplay = document.getElementById('status-display');

    // Split text into chunks (sentences/lines) for granular highlighting
    // Regex splits by period, question mark, exclamation point, or newline, keeping the delimiter
    const chunks = rawText.match(/[^.!?\n]+[.!?\n]*/g) || [rawText];

    // Render chunks as spans
    contentArea.innerHTML = chunks.map((chunk, index) =>
        `<span id="chunk-${index}" class="text-chunk">${chunk}</span>`
    ).join('');

    let synth = window.speechSynthesis;
    let utterance = null;
    let currentChunkIndex = 0;
    let isPlaying = false;

    // Load voices (wait for them to be ready)
    let voices = [];
    window.speechSynthesis.onvoiceschanged = () => {
        voices = window.speechSynthesis.getVoices();
    };

    function updateStatus(newStatus) {
        fetch(`/api/newsletter/${newsletterId}/status`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({status: newStatus})
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                statusDisplay.innerText = data.status;
            }
        });
    }

    function speakChunk(index) {
        if (index >= chunks.length) {
            stop();
            updateStatus('done');
            return;
        }

        currentChunkIndex = index;

        // Highlight logic
        document.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));
        const activeSpan = document.getElementById(`chunk-${index}`);
        if (activeSpan) {
            activeSpan.classList.add('highlight');
            activeSpan.scrollIntoView({behavior: "smooth", block: "center"});
        }

        // TTS logic
        utterance = new SpeechSynthesisUtterance(chunks[index]);
        utterance.rate = parseFloat(document.getElementById('select-speed').value);

        // Optional: Select a better voice
        // const preferredVoice = voices.find(v => v.name.includes("Google US English"));
        // if (preferredVoice) utterance.voice = preferredVoice;

        utterance.onend = () => {
            if (isPlaying) {
                speakChunk(index + 1);
            }
        };

        utterance.onerror = (e) => {
            console.error("TTS Error:", e);
        };

        synth.speak(utterance);
    }

    function play() {
        if (isPlaying) return; // Already playing
        isPlaying = true;

        document.getElementById('btn-play').style.display = 'none';
        document.getElementById('btn-pause').style.display = 'inline-block';

        updateStatus('in_progress');

        if (synth.paused) {
            synth.resume();
        } else {
            speakChunk(currentChunkIndex);
        }
    }

    function pause() {
        isPlaying = false;
        document.getElementById('btn-play').style.display = 'inline-block';
        document.getElementById('btn-pause').style.display = 'none';
        synth.cancel(); // Stop speaking immediately
    }

    function stop() {
        isPlaying = false;
        currentChunkIndex = 0;
        document.getElementById('btn-play').style.display = 'inline-block';
        document.getElementById('btn-pause').style.display = 'none';
        document.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));
        synth.cancel();
    }

    // Event Listeners
    document.getElementById('btn-play').addEventListener('click', play);
    document.getElementById('btn-pause').addEventListener('click', pause);
    document.getElementById('btn-stop').addEventListener('click', stop);

    document.getElementById('btn-done').addEventListener('click', () => {
        stop();
        updateStatus('done');
        window.location.href = '/'; // Go back home
    });

    // Cleanup when leaving page
    window.onbeforeunload = () => {
        synth.cancel();
    };

</script>
{% endblock %}
